<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分管理</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body {
    background: linear-gradient(145deg, #f6f9fc, #e9f1f8);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    margin: 0; padding: 1.5rem;
  }
  .card {
    max-width: 1000px; width: 100%; background: rgba(255,255,255,0.85);
    border-radius: 2rem; padding: 2rem; box-shadow: 0 20px 40px -15px rgba(0,20,40,0.3);
    border: 1px solid #ffffffcc;
  }
  h1 { margin: 0 0 1rem 0; color: #0b2a44; font-size: 1.7rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
  .status { font-size: 0.8rem; font-weight: 600; padding: 0.3rem 1rem; border-radius: 40px; background: #fff3d6; color: #8b5e00; display: flex; align-items: center; gap: 0.4rem; }
  .status.ok { background: #e0f5e9; color: #1e7a4a; }
  .status.err { background: #ffe9e9; color: #b13e3e; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: p 1.5s infinite; }
  @keyframes p { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .tabs { display: flex; gap: 0.5rem; background: #edf4fc; padding: 0.4rem; border-radius: 3rem; margin-bottom: 1.5rem; width: fit-content; border: 1px solid #d4e2f0; }
  .tab { padding: 0.6rem 1.4rem; border: none; background: transparent; border-radius: 3rem; font-weight: 600; color: #5c7b9c; cursor: pointer; }
  .tab.active { background: white; color: #0a2d4a; box-shadow: 0 4px 12px rgba(0,30,60,0.12); }
  .pane { display: none; }
  .pane.active { display: block; }

  .search { display: flex; align-items: center; gap: 0.6rem; background: #ffffffcc; border: 1.5px solid #cbdae8; border-radius: 3rem; padding: 0.5rem 0.5rem 0.5rem 1.2rem; margin-bottom: 1.2rem; }
  .search input { flex: 1; border: none; background: transparent; font-size: 0.95rem; outline: none; padding: 0.4rem 0; color: #153e5a; }
  .info { font-size: 0.8rem; color: #1e5c8b; font-weight: 600; background: #e2effb; padding: 0.3rem 0.8rem; border-radius: 3rem; white-space: nowrap; }
  .clear { background: #edf4fc; border: 1px solid #bed6ec; color: #1b3c5c; padding: 0.5rem 1rem; border-radius: 3rem; font-size: 0.85rem; font-weight: 600; cursor: pointer; }

  .panel { background: #fff; border-radius: 1.5rem; padding: 1.2rem 1.5rem; margin-bottom: 1.2rem; border: 1px solid #dbe9f5; }
  .panel h3 { margin: 0 0 0.8rem 0; font-size: 0.95rem; color: #284b6c; }
  .team-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.8rem; }
  .chip { display: inline-flex; align-items: center; gap: 0.4rem; background: #e2effb; color: #1e5c8b; padding: 0.3rem 0.4rem 0.3rem 0.9rem; border-radius: 3rem; font-size: 0.85rem; font-weight: 600; border: 1px solid #bed6ec; }
  .chip button { background: #ffffffaa; border: none; cursor: pointer; width: 20px; height: 20px; border-radius: 50%; color: #b13e3e; font-weight: 700; }

  .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; background: #ffffffcc; padding: 0.9rem 1.2rem; border-radius: 1.5rem; border: 1px solid #d4e2f0; }
  .row input, .row select { padding: 0.65rem 1rem; border: 1.5px solid #cbdae8; border-radius: 3rem; font-size: 0.9rem; outline: none; min-width: 130px; background: white; font-weight: 500; }

  .btn { background: #1e3b5a; border: none; color: white; padding: 0.65rem 1.3rem; border-radius: 3rem; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
  .btn.danger { background: #ffe9e9; color: #b13e3e; border: 1px solid #f7c1c1; }
  .btn.sm { padding: 0.4rem 0.9rem; font-size: 0.8rem; }

  .persons { display: flex; flex-direction: column; gap: 1rem; max-height: 520px; overflow-y: auto; padding-right: 6px; }
  .person { background: white; border-radius: 1.5rem; padding: 1rem 1.3rem; border: 1px solid #dbe9f5; display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; box-shadow: 0 4px 12px rgba(0,30,60,0.06); }
  .person.hl { border-color: #f5d67a; background: linear-gradient(135deg, #fffdf5, #fff); }
  .pinfo { flex: 2 1 220px; }
  .pname { font-size: 1.2rem; font-weight: 700; color: #0a2d4a; display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .badge { font-size: 0.7rem; font-weight: 500; background: #e2effb; padding: 0.15rem 0.7rem; border-radius: 40px; color: #1e5c8b; }
  .tname { font-size: 0.7rem; font-weight: 600; padding: 0.15rem 0.7rem; border-radius: 40px; background: #e2effb; color: #1e5c8b; }
  .pstats { display: flex; gap: 1.3rem; margin-top: 0.3rem; }
  .sl { font-size: 0.65rem; text-transform: uppercase; color: #5c7b9c; font-weight: 600; }
  .sv { font-size: 1.3rem; font-weight: 700; color: #0a2d4a; }
  .pteam { margin-top: 0.5rem; display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: #7999b6; font-weight: 600; }
  .pteam select { padding: 0.25rem 0.7rem; border: 1px solid #cbdae8; border-radius: 3rem; font-size: 0.8rem; font-weight: 600; background: white; }
  .pact { flex: 3 1 380px; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; justify-content: flex-end; }
  .ag { display: flex; align-items: center; gap: 0.3rem; background: #f6faff; padding: 0.25rem 0.25rem 0.25rem 0.9rem; border-radius: 3rem; border: 1px solid #d4e2f0; }
  .ag input { width: 75px; padding: 0.45rem 0.5rem; border: 1px solid #cbdae8; border-radius: 2rem; font-size: 0.85rem; text-align: center; font-weight: 600; outline: none; }

  .empty { color: #9eb7cf; font-style: italic; font-size: 0.9rem; text-align: center; padding: 1.2rem 0; }
  .nomatch { color: #9eb7cf; font-style: italic; text-align: center; padding: 2rem 0; background: #f6faff; border-radius: 1.5rem; border: 1px dashed #d4e2f0; }

  .rank-item { display: flex; align-items: center; gap: 1rem; padding: 0.7rem 1.1rem; border-radius: 1.4rem; background: #f6faff; border: 1px solid #e2eefc; margin-bottom: 0.5rem; }
  .rank-item.top1 { background: linear-gradient(135deg,#fff8e0,#ffedb8); border-color:#f5d67a; }
  .rank-item.top2 { background: linear-gradient(135deg,#f4f7fa,#e5ecf2); border-color:#c4d4e2; }
  .rank-item.top3 { background: linear-gradient(135deg,#fdf0e3,#f8ddc0); border-color:#e8c298; }
  .medal { font-size: 1.5rem; width: 2rem; text-align: center; }
  .rname { font-size: 1rem; font-weight: 700; color: #0a2d4a; display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
  .rsub { font-size: 0.75rem; color: #7999b6; }
  .rscore { margin-left: auto; font-size: 1.3rem; font-weight: 800; color: #0f3b5e; text-align: right; }
  .rscore small { display: block; font-size: 0.65rem; color: #7999b6; font-weight: 600; }

  .hist { background: #ffffffd9; border-radius: 1.5rem; padding: 1rem 1.3rem; margin-top: 1.5rem; border: 1px solid #d4e2f0; }
  .hist h3 { margin: 0 0 0.8rem 0; font-size: 0.95rem; color: #284b6c; display: flex; justify-content: space-between; }
  .hlist { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.4rem; }
  .hitem { display: flex; justify-content: space-between; align-items: center; background: #f6faff; padding: 0.5rem 0.9rem; border-radius: 2rem; font-size: 0.83rem; border: 1px solid #e2eefc; flex-wrap: wrap; gap: 0.4rem; }
  .hwho { font-weight: 600; color: #1e3b5a; min-width: 70px; }
  .hwhat { flex: 1; color: #2b4e6e; }
  .hdiff { font-weight: 700; padding: 0.1rem 0.6rem; border-radius: 30px; font-size: 0.78rem; }
  .hdiff.pos { color: #1e7a4a; background: #e0f5e9; }
  .hdiff.neg { color: #b13e3e; background: #ffe9e9; }
  .hdiff.tk { color: #8b5e00; background: #fff3d6; }
</style>
</head>
<body>
<div class="card">
  <h1>
    ⚡ 积分管理系统
    <span class="status" id="status"><span class="dot"></span><span id="statusText">连接中...</span></span>
  </h1>

  <div class="tabs">
    <button class="tab active" data-tab="manage">📝 积分管理</button>
    <button class="tab" data-tab="rank">🏆 排行榜</button>
  </div>

  <div class="pane active" id="pane-manage">
    <div class="search">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="搜索成员名字或小队名字..." />
      <span class="info" id="searchInfo" style="display:none;"></span>
      <button class="clear" id="searchClear" style="display:none;">✕ 清空</button>
    </div>

    <div class="panel">
      <h3>🛡️ 小队管理</h3>
      <div class="team-list" id="teamList"></div>
      <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
        <input type="text" id="newTeamName" placeholder="输入小队名字" style="padding:0.65rem 1rem;border:1.5px solid #cbdae8;border-radius:3rem;font-size:0.9rem;outline:none;" />
        <button class="btn" id="addTeamBtn">➕ 创建小队</button>
      </div>
    </div>

    <div class="row">
      <input type="text" id="newPersonName" placeholder="输入名称" />
      <select id="newPersonTeam"><option value="">无小队</option></select>
      <button class="btn" id="addPersonBtn">➕ 添加名称</button>
      <button class="btn danger" id="resetAllBtn">⟲ 重置全部</button>
    </div>

    <div class="persons" id="personsContainer"><div class="empty">加载中...</div></div>

    <div class="hist">
      <h3><span>📋 操作记录</span><span id="historyCount" style="font-size:0.8rem;color:#6b8aa8;font-weight:400;">0 条</span></h3>
      <div class="hlist" id="historyList"><div class="empty">加载中...</div></div>
    </div>
  </div>

  <div class="pane" id="pane-rank">
    <div class="panel">
      <h3>🏅 个人排行榜（按最高积分）</h3>
      <div id="personalRankList"><div class="empty">暂无数据</div></div>
    </div>
    <div class="panel">
      <h3>🛡️ 小队排行榜（队内最高积分之和）</h3>
      <div id="teamRankList"><div class="empty">暂无数据</div></div>
    </div>
  </div>
</div>

<script type="module">
  const SUPABASE_URL = 'https://sutokyrdqusefoikghth.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_xXHfeQ8mBfy_92MH59xDdg_01llQFJ4';
  const ROW_ID = 'main';

  // 多个 CDN 备用
  let createClient = null;
  const CDNS = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm',
    'https://esm.sh/@supabase/supabase-js@2',
    'https://unpkg.com/@supabase/supabase-js@2/+esm'
  ];

  async function loadSupabase() {
    for (const url of CDNS) {
      try {
        const mod = await import(url);
        if (mod && mod.createClient) {
          console.log('✅ CDN 加载成功:', url);
          return mod.createClient;
        }
      } catch (e) {
        console.warn('❌ CDN 失败:', url, e.message);
      }
    }
    throw new Error('所有 CDN 都无法加载');
  }

  let persons = [], teams = [], history = [];
  let supabase = null, channel = null, keyword = '';

  const $ = id => document.getElementById(id);
  const statusEl = $('status'), statusText = $('statusText');

  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('pane-' + t.dataset.tab).classList.add('active');
  });

  function setStatus(state, txt) {
    statusEl.className = 'status' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
    statusText.textContent = txt;
  }

  async function init() {
    try {
      setStatus('', '加载中...');
      createClient = await loadSupabase();
      supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
      setStatus('ok', '已连接');
      await load();
      listen();
    } catch (e) {
      console.error(e);
      setStatus('err', '连接失败');
      $('personsContainer').innerHTML = `<div class="empty">❌ 加载失败：${e.message}<br><br>请检查网络是否能访问 Supabase</div>`;
    }
  }

  async function load() {
    const { data, error } = await supabase.from('points_system').select('*').eq('id', ROW_ID).maybeSingle();
    if (error) {
      console.error(error);
      $('personsContainer').innerHTML = `<div class="empty">❌ 加载失败：${error.message}</div>`;
      return;
    }
    if (data) {
      persons = data.persons || [];
      teams = data.teams || [];
      history = data.history || [];
    } else {
      persons = []; teams = []; history = [];
      await save();
    }
    render();
  }

  function listen() {
    if (channel) supabase.removeChannel(channel);
    channel = supabase.channel('ps').on('postgres_changes',
      { event: '*', schema: 'public', table: 'points_system', filter: `id=eq.${ROW_ID}` },
      (p) => {
        if (p.new) {
          persons = p.new.persons || [];
          teams = p.new.teams || [];
          history = p.new.history || [];
          render();
        }
      }
    ).subscribe(s => {
      if (s === 'SUBSCRIBED') setStatus('ok', '已连接');
      else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') setStatus('err', '实时断开');
    });
  }

  async function save() {
    if (!supabase) return;
    try {
      const { error } = await supabase.from('points_system').upsert({
        id: ROW_ID, persons, teams, history, updated_at: new Date().toISOString()
      }, { onConflict: 'id' });
      if (error) throw error;
      setStatus('ok', '已连接');
    } catch (e) {
      console.error(e);
      setStatus('err', '保存失败');
      setTimeout(() => setStatus('ok', '已连接'), 2000);
    }
  }

  function now() {
    const d = new Date();
    return [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':');
  }
  function log(name, type, amount) {
    history.push({ name, type, amount, timestamp: now() });
    if (history.length > 100) history = history.slice(-100);
  }
  function esc(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  }
  const findP = n => persons.findIndex(p => p.name === n);
  const findT = id => teams.find(t => t.id === id);
  const genId = () => 't' + Date.now() + Math.random().toString(36).slice(2, 6);

  function render() {
    renderTeams();
    renderPersons();
    renderHistory();
    renderPersonalRank();
    renderTeamRank();
  }

  function renderTeams() {
    $('teamList').innerHTML = teams.length === 0
      ? '<span style="color:#9eb7cf;font-size:0.85rem;font-style:italic;">还没有小队</span>'
      : teams.map(t => `<span class="chip">🛡️ ${esc(t.name)}<button data-tid="${t.id}">✕</button></span>`).join('');
    const cur = $('newPersonTeam').value;
    $('newPersonTeam').innerHTML = '<option value="">无小队</option>' +
      teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
    if (teams.some(t => t.id === cur)) $('newPersonTeam').value = cur;
    document.querySelectorAll('.member-team-select').forEach(sel => {
      const p = persons.find(x => x.name === sel.dataset.name);
      const cur2 = p ? (p.teamId || '') : '';
      sel.innerHTML = '<option value="">无小队</option>' +
        teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
      sel.value = cur2;
    });
  }

  function renderPersons() {
    const kw = keyword;
    const list = !kw ? persons : persons.filter(p => {
      const t = findT(p.teamId);
      const tn = t ? t.name : '';
      return p.name.toLowerCase().includes(kw) || tn.toLowerCase().includes(kw);
    });

    if (kw) {
      $('searchInfo').style.display = 'inline-block';
      $('searchClear').style.display = 'inline-block';
      $('searchInfo').textContent = `找到 ${list.length} 个`;
    } else {
      $('searchInfo').style.display = 'none';
      $('searchClear').style.display = 'none';
    }

    if (persons.length === 0) {
      $('personsContainer').innerHTML = '<div class="empty">还没有任何名称，请先添加</div>';
      return;
    }
    if (list.length === 0) {
      $('personsContainer').innerHTML = `<div class="nomatch">🔍 没有找到匹配「${esc($('searchInput').value)}」的成员或小队</div>`;
      return;
    }

    $('personsContainer').innerHTML = list.map(p => {
      const t = findT(p.teamId);
      const hl = kw ? 'hl' : '';
      return `
        <div class="person ${hl}" data-name="${esc(p.name)}">
          <div class="pinfo">
            <div class="pname">${esc(p.name)}<span class="badge">🎯 最高 ${p.maxPoints}</span>${t ? `<span class="tname">🛡️ ${esc(t.name)}</span>` : ''}</div>
            <div class="pstats">
              <div><div class="sl">历史最高</div><div class="sv">${p.maxPoints}</div></div>
              <div><div class="sl">剩余积分</div><div class="sv" style="color:${p.remainingPoints < 0 ? '#b13e3e' : '#1e7a4a'}">${p.remainingPoints}</div></div>
            </div>
            <div class="pteam">所属小队：<select class="member-team-select" data-name="${esc(p.name)}"></select></div>
          </div>
          <div class="pact">
            <div class="ag"><input type="number" class="add-input" value="10" /><button class="btn sm add-btn" data-name="${esc(p.name)}">➕ 增加</button></div>
            <div class="ag"><input type="number" class="normal-input" value="5" /><button class="btn sm normal-btn" data-name="${esc(p.name)}" style="background:#edf4fc;color:#1b3c5c;border:1px solid #bed6ec;">普通扣除</button></div>
            <div class="ag"><input type="number" class="ticket-input" value="5" /><button class="btn sm ticket-btn" data-name="${esc(p.name)}" style="background:#8b5e00;">🎫 门票扣除</button></div>
          </div>
        </div>`;
    }).join('');

    $('personsContainer').onclick = e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const name = btn.dataset.name;
      if (!name) return;
      if (btn.classList.contains('add-btn')) {
        const v = Number(btn.closest('.ag').querySelector('.add-input').value);
        if (!v || v <= 0) return alert('请输入大于0的数');
        const i = findP(name); if (i < 0) return;
        persons[i].remainingPoints += v;
        if (persons[i].remainingPoints > persons[i].maxPoints) persons[i].maxPoints = persons[i].remainingPoints;
        log(name, 'add', v);
        render(); save();
      } else if (btn.classList.contains('normal-btn')) {
        const v = Number(btn.closest('.ag').querySelector('.normal-input').value);
        if (!v || v <= 0) return alert('请输入大于0的数');
        const i = findP(name); if (i < 0) return;
        if (persons[i].remainingPoints < v) return alert('剩余积分不足');
        persons[i].remainingPoints -= v;
        log(name, 'normal', v);
        render(); save();
      } else if (btn.classList.contains('ticket-btn')) {
        const v = Number(btn.closest('.ag').querySelector('.ticket-input').value);
        if (!v || v <= 0) return alert('请输入大于0的数');
        const i = findP(name); if (i < 0) return;
        if (persons[i].remainingPoints < v) return alert('剩余积分不足');
        if (persons[i].maxPoints < v) return alert('最高积分不足');
        persons[i].remainingPoints -= v;
        persons[i].maxPoints -= v;
        log(name, 'ticket', v);
        render(); save();
      }
    };

    document.querySelectorAll('.member-team-select').forEach(sel => {
      sel.onchange = e => {
        const i = findP(sel.dataset.name);
        if (i < 0) return;
        persons[i].teamId = e.target.value;
        render(); save();
      };
    });
  }

  function renderHistory() {
    $('historyCount').textContent = `${history.length} 条`;
    if (history.length === 0) { $('historyList').innerHTML = '<div class="empty">暂无记录</div>'; return; }
    $('historyList').innerHTML = [...history].reverse().map(h => {
      const cls = h.type === 'add' ? 'pos' : h.type === 'ticket' ? 'tk' : 'neg';
      const txt = h.type === 'add' ? '新增积分' : h.type === 'ticket' ? '门票扣除' : '普通扣除';
      const sign = h.type === 'add' ? '+' : '-';
      return `<div class="hitem"><span class="hwho">${esc(h.name)}</span><span class="hwhat">${txt}</span><span class="hdiff ${cls}">${sign}${h.amount}</span><span style="font-size:0.7rem;color:#7999b6;">🕒 ${h.timestamp}</span></div>`;
    }).join('');
  }

  function renderPersonalRank() {
    if (persons.length === 0) { $('personalRankList').innerHTML = '<div class="empty">暂无数据</div>'; return; }
    const sorted = [...persons].sort((a, b) => b.maxPoints - a.maxPoints);
    $('personalRankList').innerHTML = sorted.map((p, i) => {
      const cls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
      const t = findT(p.teamId);
      return `<div class="rank-item ${cls}"><div class="medal">${medal}</div><div style="flex:1;min-width:0;"><div class="rname">${esc(p.name)}${t ? `<span class="tname">🛡️ ${esc(t.name)}</span>` : ''}</div><div class="rsub">剩余积分 ${p.remainingPoints}</div></div><div class="rscore">${p.maxPoints}<small>最高积分</small></div></div>`;
    }).join('');
  }

  function renderTeamRank() {
    const map = {};
    teams.forEach(t => map[t.id] = { name: t.name, total: 0, members: [] });
    persons.forEach(p => {
      if (p.teamId && map[p.teamId]) {
        map[p.teamId].total += p.maxPoints;
        map[p.teamId].members.push(p.name);
      }
    });
    const arr = Object.values(map).sort((a, b) => b.total - a.total);
    if (arr.length === 0) { $('teamRankList').innerHTML = '<div class="empty">还没有小队</div>'; return; }
    $('teamRankList').innerHTML = arr.map((t, i) => {
      const cls = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
      return `<div class="rank-item ${cls}"><div class="medal">${medal}</div><div style="flex:1;min-width:0;"><div class="rname">🛡️ ${esc(t.name)}</div><div class="rsub">队员：${t.members.length ? t.members.map(esc).join('、') : '暂无成员'}</div></div><div class="rscore">${t.total}<small>小队总分</small></div></div>`;
    }).join('');
  }

  // 事件绑定
  $('addPersonBtn').onclick = () => {
    const name = $('newPersonName').value.trim();
    const teamId = $('newPersonTeam').value;
    if (!name) return alert('请输入名称');
    if (persons.some(p => p.name === name)) return alert('该名称已存在');
    persons.push({ name, maxPoints: 0, remainingPoints: 0, teamId });
    $('newPersonName').value = '';
    render(); save();
  };
  $('newPersonName').onkeypress = e => { if (e.key === 'Enter') $('addPersonBtn').click(); };

  $('addTeamBtn').onclick = () => {
    const name = $('newTeamName').value.trim();
    if (!name) return alert('请输入小队名字');
    if (teams.some(t => t.name === name)) return alert('该名字已存在');
    teams.push({ id: genId(), name });
    $('newTeamName').value = '';
    render(); save();
  };
  $('newTeamName').onkeypress = e => { if (e.key === 'Enter') $('addTeamBtn').click(); };

  $('resetAllBtn').onclick = () => {
    if (!confirm('确定清空所有数据吗？')) return;
    persons = []; teams = []; history = [];
    render(); save();
  };

  $('teamList').onclick = e => {
    const btn = e.target.closest('button[data-tid]');
    if (!btn) return;
    const tid = btn.dataset.tid;
    const t = findT(tid);
    if (!t) return;
    if (!confirm(`删除小队「${t.name}」？队内成员将变为无小队`)) return;
    teams = teams.filter(x => x.id !== tid);
    persons.forEach(p => { if (p.teamId === tid) p.teamId = ''; });
    render(); save();
  };

  $('searchInput').oninput = e => { keyword = e.target.value.trim().toLowerCase(); renderPersons(); };
  $('searchClear').onclick = () => { $('searchInput').value = ''; keyword = ''; renderPersons(); };

  init();
</script>
</body>
</html>
